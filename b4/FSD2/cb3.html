<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        let x=3
        let y=2        
        
        setInterval(my,1000)
        
        function my(){
            document.getElementById('temp').innerHTML=++x + ++y
        }

    </script>
</head>
<body>
    <h1 id="temp"></h1>
    
</body>
</html>
