<!-- Write a js code that display ”Hello” with increasing font size in interval of 50ms in blue colour and it should stop when font size reaches to 50px. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="p1" style="color: blue;">HELLO</p>
    <button onclick="setInterval(fun,200)" >click</button>
    <script>
        size=15
        function fun(){
            obj=document.getElementById("p1")
            
            obj.style.fontSize  = size+'px'

            if(size<=50){
                size++
            }
        }
        
    </script>

</body>
</html>
